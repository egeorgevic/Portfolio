# Netlify deploy config — static site, no build step.
[build]
  publish = "."

# Serve the friendly 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Long-cache immutable assets (images, fonts, css/js)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Long-cache the self-hosted fonts (content-stable, never re-fetched)
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers. Both scripts and stylesheets are strictly 'self'; the only
# 'unsafe-inline' left is style-src-attr, for the inline style="" attributes
# still in the markup. Inline CSS cannot execute script. The plain style-src is
# the fallback for browsers that don't implement the -elem/-attr split.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.web3forms.com; form-action 'self' https://api.web3forms.com; frame-ancestors 'self'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests"
